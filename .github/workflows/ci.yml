name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [H2, PostgreSQL]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Point the tests at PostgreSQL
        if: matrix.database == 'PostgreSQL'
        run: |
          echo "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/taskflow" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_USERNAME=taskflow" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=taskflow" >> "$GITHUB_ENV"
      - name: Run tests and build
        working-directory: backend
        run: ./gradlew build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start every service
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Log in through the frontend's proxy
        run: |
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/projects/1
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"email":"demo@taskflow.dev","password":"demo12345"}' \
            http://localhost:3000/api/auth/login --output /dev/null
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
