server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to this server, so the API needs no CORS setup.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File names of built assets contain a content hash, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always check for a new index.html, since it is what points to the latest assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes such as /projects/3 only exist in the browser, so a direct visit or reload gets the app.
    location / {
        try_files $uri /index.html;
    }
}
