spring:
  application:
    name: taskflow
  profiles:
    default: dev
  jpa:
    # Mapping entities to DTOs happens inside service transactions, so the session
    # does not need to stay open while the response is written.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

taskflow:
  jwt:
    # Blank means a random key per application start. Set it for anything that outlives one run.
    secret: ${JWT_SECRET:}
    expiry: ${JWT_EXPIRY:PT1H}
  # Time zone used to decide what "today" is. Blank means the server's time zone.
  time-zone: ${TASKFLOW_TIME_ZONE:}
  seed:
    enabled: ${TASKFLOW_SEED_ENABLED:false}
    password: ${TASKFLOW_SEED_PASSWORD:}
